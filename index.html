<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>6767676767676767676767676767676767676767</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            overflow: hidden;
        }
        canvas {
            background-color: #2b2b2b;
            border: 2px solid #555;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            cursor: crosshair; 
        }
    </style>
</head>
<body>

    <canvas id="simCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // --- 物理常數與狀態 ---
        const gravity = 9.81;
        const M = 1.0;   
        const m = 0.2;   
        const l = 1.0;   
        const scale = 100; 
        const polePixelLength = l * 2 * scale; 

        let x = 0.0;          
        let x_dot = 0.0;      
        let theta = 0.05;     
        let theta_dot = 0.0;  

        const Kp_theta = 300.0; 
        const Kd_theta = 60.0;
        const Kp_x = 3.0;  
        const Kd_x = 8.0;

        // --- 憤怒鳥互動 (彈弓) 變數 ---
        let isDragging = false;       
        let grabPointDist = 0;        
        let currentMouseX = 0;        
        let currentMouseY = 0;        
        
        let cameraX = 0.0; 

        // 結界範圍 (左上角)
        const prison = { x: 20, y: 20, w: 200, h: 100 };

        // --- 【修改】野生標題怪物變數 (預設關在結界裡) ---
        let monster = {
            x: prison.x + 25, y: prison.y + 25, // 初始位置在結界內
            vx: 3, vy: 3,  // 給一點初始動能讓它在裡面撞
            w: 150, h: 48, 
            state: 3,      // 0: 亂飄, 1: 突襲, 2: 被玩家抓著, 3: 關在結界裡
            timer: 15.0,   // 第一次預設 15 秒脫逃
            offsetX: 0, offsetY: 0
        };

        // --- 物理引擎 ---
        function physicsStep(dt, force) {
            const totalMass = M + m;
            const ml = m * l;
            const sinTheta = Math.sin(theta);
            const cosTheta = Math.cos(theta);

            const temp = (force + ml * theta_dot * theta_dot * sinTheta) / totalMass;
            let theta_acc = (gravity * sinTheta - cosTheta * temp) / 
                            (l * (4.0 / 3.0 - (m * cosTheta * cosTheta) / totalMass));
            const x_acc = temp - (ml * theta_acc * cosTheta) / totalMass;

            x_dot += x_acc * dt;
            theta_dot += theta_acc * dt;
            x += x_dot * dt;
            theta += theta_dot * dt;
        }

        // --- 邊界反彈輔助函式 ---
        function bounceMonster(bounds) {
            if (monster.x < bounds.x) { monster.x = bounds.x; monster.vx *= -1; }
            if (monster.x + monster.w > bounds.x + bounds.w) { monster.x = bounds.x + bounds.w - monster.w; monster.vx *= -1; }
            if (monster.y < bounds.y) { monster.y = bounds.y; monster.vy *= -1; }
            if (monster.y + monster.h > bounds.y + bounds.h) { monster.y = bounds.y + bounds.h - monster.h; monster.vy *= -1; }
        }

        // --- 怪物文字邏輯更新 ---
        function updateMonster(dt) {
            ctx.font = 'bold 48px "Segoe UI"';
            monster.w = ctx.measureText("倒立擺").width;

            const cartScreenX = (canvas.width / 2) + (x - cameraX) * scale;
            const screenY = 400;

            if (monster.state === 0) { // 狀態0：亂飄
                if (Math.random() < 0.05) {
                    monster.vx += (Math.random() - 0.5);
                    monster.vy += (Math.random() - 0.5);
                }
                const speed = Math.hypot(monster.vx, monster.vy);
                if (speed > 2) { monster.vx = (monster.vx/speed)*2; monster.vy = (monster.vy/speed)*2; }
                
                monster.x += monster.vx;
                monster.y += monster.vy;
                bounceMonster({x:0, y:0, w:canvas.width, h:canvas.height});

                if (Math.random() < 0.005) {
                    monster.state = 1; // 突襲！
                }
            } 
            else if (monster.state === 1) { // 狀態1：突襲
                const targetX = cartScreenX + (polePixelLength / 2) * Math.sin(theta);
                const targetY = screenY - (polePixelLength / 2) * Math.cos(theta);
                
                const dx = targetX - (monster.x + monster.w/2);
                const dy = targetY - (monster.y + monster.h/2);
                const dist = Math.hypot(dx, dy);

                if (dist > 0) {
                    monster.vx = (dx / dist) * 12;
                    monster.vy = (dy / dist) * 12;
                }
                monster.x += monster.vx;
                monster.y += monster.vy;

                if (dist < 50) {
                    const hitForce = monster.vx > 0 ? 8 : -8;
                    theta_dot += hitForce; 
                    
                    monster.vx = -monster.vx * 0.5;
                    monster.vy = -monster.vy * 0.5;
                    monster.state = 0; 
                }
            }
            else if (monster.state === 2) { // 狀態2：被玩家抓著
                // 【修改】加入劇烈掙扎 (隨機抖動)
                const struggleX = (Math.random() - 0.5) * 15;
                const struggleY = (Math.random() - 0.5) * 15;
                monster.x = currentMouseX - monster.offsetX + struggleX;
                monster.y = currentMouseY - monster.offsetY + struggleY;
            }
            else if (monster.state === 3) { // 狀態3：關在結界裡
                monster.timer -= dt; 
                if (monster.timer <= 0) {
                    // 時間到！爆發逃脫！
                    monster.state = 0; 
                    monster.vx = 8; 
                    monster.vy = 5;
                } else {
                    monster.vx += (Math.random() - 0.5) * 4;
                    monster.vy += (Math.random() - 0.5) * 4;
                    const speed = Math.hypot(monster.vx, monster.vy);
                    if (speed > 5) { monster.vx = (monster.vx/speed)*5; monster.vy = (monster.vy/speed)*5; }
                    
                    monster.x += monster.vx;
                    monster.y += monster.vy;
                    bounceMonster(prison);
                }
            }
        }

        // --- 繪圖邏輯 ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            cameraX += (x - cameraX) * 0.1;

            const screenCenter = canvas.width / 2;
            const screenY = 400; 
            const cartScreenX = screenCenter + (x - cameraX) * scale;

            // --- 繪製封印結界 (無文字版) ---
            ctx.strokeStyle = '#FF5722'; 
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 5]); 
            ctx.strokeRect(prison.x, prison.y, prison.w, prison.h);
            ctx.setLineDash([]);
            
            ctx.fillStyle = 'rgba(255, 87, 34, 0.15)';
            ctx.fillRect(prison.x, prison.y, prison.w, prison.h);

            // --- 繪製軌道與刻度 ---
            ctx.strokeStyle = '#777'; 
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, screenY);
            ctx.lineTo(canvas.width, screenY);
            ctx.stroke();

            const viewRadiusInMeters = (canvas.width / 2) / scale;
            const startMeter = Math.floor(cameraX - viewRadiusInMeters);
            const endMeter = Math.ceil(cameraX + viewRadiusInMeters);

            ctx.fillStyle = '#FFFFFF'; 
            ctx.font = 'bold 16px Arial'; 
            ctx.textAlign = 'center';
            for (let i = startMeter; i <= endMeter; i++) {
                const tickScreenX = screenCenter + (i - cameraX) * scale;
                ctx.beginPath();
                ctx.moveTo(tickScreenX, screenY);
                ctx.lineTo(tickScreenX, screenY + 12);
                ctx.stroke();
                ctx.fillText(i + 'm', tickScreenX, screenY + 30);
            }

            // --- 繪製小車與擺桿 ---
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(cartScreenX - 50, screenY - 20, 100, 40); 

            ctx.save(); 
            ctx.translate(cartScreenX, screenY); 
            ctx.rotate(theta); 
            
            ctx.fillStyle = '#F44336';
            const poleWidth = 14; 
            ctx.fillRect(-poleWidth/2, -polePixelLength, poleWidth, polePixelLength); 
            
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore(); 

            // --- 繪製怪物文字 ---
            ctx.font = 'bold 48px "Segoe UI"';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            
            if (monster.state === 1) ctx.fillStyle = '#F44336'; // 突襲：警戒紅
            else if (monster.state === 2) ctx.fillStyle = '#FFC107'; // 抓取：黃色 (掙扎中)
            else if (monster.state === 3) ctx.fillStyle = 'rgba(255, 87, 34, 0.7)'; // 牢籠：橘紅掙扎
            else ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; // 亂飄：半透明白
            
            ctx.fillText("倒立擺", monster.x, monster.y);

            // --- 繪製憤怒鳥橡皮筋 ---
            if (isDragging) {
                const grabScreenX = cartScreenX + (grabPointDist * scale) * Math.sin(theta);
                const grabScreenY = screenY - (grabPointDist * scale) * Math.cos(theta);

                let dx = currentMouseX - grabScreenX;
                let dy = currentMouseY - grabScreenY;
                const pullDist = Math.hypot(dx, dy);
                const maxVisualPull = 200;
                
                let drawMouseX = currentMouseX;
                let drawMouseY = currentMouseY;
                
                if (pullDist > maxVisualPull) {
                    drawMouseX = grabScreenX + (dx / pullDist) * maxVisualPull;
                    drawMouseY = grabScreenY + (dy / pullDist) * maxVisualPull;
                }

                ctx.strokeStyle = '#FFEB3B'; 
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(grabScreenX, grabScreenY);
                ctx.lineTo(drawMouseX, drawMouseY);
                ctx.stroke();

                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.arc(drawMouseX, drawMouseY, 8, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#FF9800';
                ctx.beginPath();
                ctx.arc(grabScreenX, grabScreenY, 6, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function loop() {
            const dt = 1.0 / 60.0; 

            updateMonster(dt);

            let controlForce = (Kp_theta * theta) + 
                               (Kd_theta * theta_dot) + 
                               (Kp_x * x) + 
                               (Kd_x * x_dot);

            controlForce = Math.max(-150, Math.min(150, controlForce));

            physicsStep(dt, controlForce);
            draw();
            requestAnimationFrame(loop);
        }

        // --- 互動偵測 ---
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left; 
            const mouseY = e.clientY - rect.top; 
            
            currentMouseX = mouseX;
            currentMouseY = mouseY;

            // 1. 檢查是否抓取怪物文字
            if (mouseX >= monster.x && mouseX <= monster.x + monster.w && 
                mouseY >= monster.y && mouseY <= monster.y + monster.h) {
                monster.state = 2; // 被抓取
                monster.offsetX = mouseX - monster.x;
                monster.offsetY = mouseY - monster.y;
                return;
            }

            // 2. 檢查拉彈弓
            const cartScreenX = (canvas.width / 2) + (x - cameraX) * scale;
            const cartScreenY = 400;
            const dx = mouseX - cartScreenX;
            const dy = mouseY - cartScreenY;
            const local_x = dx * Math.cos(theta) + dy * Math.sin(theta);
            const local_y = -dx * Math.sin(theta) + dy * Math.cos(theta);

            if (local_y <= 20 && local_y >= -(polePixelLength + 20) && local_x >= -40 && local_x <= 40) {
                isDragging = true;
                let bounded_local_y = Math.min(0, Math.max(-polePixelLength, local_y));
                grabPointDist = Math.abs(bounded_local_y) / scale; 
            }
        });

        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            currentMouseX = e.clientX - rect.left;
            currentMouseY = e.clientY - rect.top;
        });

        window.addEventListener('mouseup', () => {
            // 放開怪物判定
            if (monster.state === 2) {
                const centerMX = monster.x + monster.w / 2;
                const centerMY = monster.y + monster.h / 2;
                
                if (centerMX > prison.x && centerMX < prison.x + prison.w && 
                    centerMY > prison.y && centerMY < prison.y + prison.h) {
                    monster.state = 3; 
                    // 【修改】重新收容，給予隨機 10 ~ 15 秒脫逃時間
                    monster.timer = 10.0 + Math.random() * 5.0; 
                } else {
                    monster.state = 0; 
                    monster.vx = 0; monster.vy = 0; 
                }
            }

            // 放開彈弓判定
            if (isDragging) {
                const cartScreenX = (canvas.width / 2) + (x - cameraX) * scale;
                const cartScreenY = 400;
                const grabScreenX = cartScreenX + (grabPointDist * scale) * Math.sin(theta);
                const grabScreenY = cartScreenY - (grabPointDist * scale) * Math.cos(theta);

                let pullX = grabScreenX - currentMouseX;
                let pullY = grabScreenY - currentMouseY;

                const maxPull = 200;
                let pullDist = Math.hypot(pullX, pullY);
                if (pullDist > maxPull) {
                    pullX = (pullX / pullDist) * maxPull;
                    pullY = (pullY / pullDist) * maxPull;
                }

                const pullLocalX = pullX * Math.cos(theta) + pullY * Math.sin(theta);
                const pullMultiplier = 0.015; 
                const impulse = pullLocalX * grabPointDist * pullMultiplier;
                
                theta_dot += impulse; 
                isDragging = false;
            }
        });

        requestAnimationFrame(loop);
    </script>
</body>
</html>
