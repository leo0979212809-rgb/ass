<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>倒立擺</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        canvas {
            background-color: #2b2b2b;
            border: 2px solid #555;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            margin-top: 20px;
            cursor: crosshair; /* 滑鼠游標改成準星會更有瞄準的感覺 */
        }
        h1 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: 5px;
            color: #ddd;
        }
        .instructions {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #aaa;
            text-align: center;
            line-height: 1.5;
        }
        .highlight { color: #FFEB3B; font-weight: bold; }
    </style>
</head>
<body>

    <h1>倒立擺</h1>
    <canvas id="simCanvas" width="800" height="500"></canvas>
    <div class="instructions">
        按住棍子並<span class="highlight">往反方向拉扯</span>，像憤怒鳥一樣放開彈擊！
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // --- 物理常數與狀態 ---
        const gravity = 9.81;
        const M = 1.0;   
        const m = 0.2;   
        const l = 1.0;   
        const scale = 100; 
        const polePixelLength = l * 2 * scale; 

        let x = 0.0;          
        let x_dot = 0.0;      
        let theta = 0.05;     
        let theta_dot = 0.0;  

        const Kp_theta = 300.0; 
        const Kd_theta = 60.0;
        const Kp_x = 3.0;  
        const Kd_x = 8.0;

        // --- 憤怒鳥互動 (彈弓) 變數 ---
        let isDragging = false;       // 是否正在拉扯
        let grabPointDist = 0;        // 抓取點距離軸心的長度 (力臂, 單位:公尺)
        let currentMouseX = 0;        // 滑鼠當前 X 座標
        let currentMouseY = 0;        // 滑鼠當前 Y 座標
        
        let cameraX = 0.0; 

        // --- 物理引擎 ---
        function physicsStep(dt, force) {
            const totalMass = M + m;
            const ml = m * l;
            const sinTheta = Math.sin(theta);
            const cosTheta = Math.cos(theta);

            const temp = (force + ml * theta_dot * theta_dot * sinTheta) / totalMass;
            let theta_acc = (gravity * sinTheta - cosTheta * temp) / 
                            (l * (4.0 / 3.0 - (m * cosTheta * cosTheta) / totalMass));
            const x_acc = temp - (ml * theta_acc * cosTheta) / totalMass;

            x_dot += x_acc * dt;
            theta_dot += theta_acc * dt;
            x += x_dot * dt;
            theta += theta_dot * dt;
        }

        // --- 繪圖邏輯 ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            cameraX += (x - cameraX) * 0.1;

            const screenCenter = canvas.width / 2;
            const screenY = 400; 

            const cartScreenX = screenCenter + (x - cameraX) * scale;

            // 繪製軌道
            ctx.strokeStyle = '#777'; 
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, screenY);
            ctx.lineTo(canvas.width, screenY);
            ctx.stroke();

            const viewRadiusInMeters = (canvas.width / 2) / scale;
            const startMeter = Math.floor(cameraX - viewRadiusInMeters);
            const endMeter = Math.ceil(cameraX + viewRadiusInMeters);

            // 繪製刻度
            ctx.fillStyle = '#FFFFFF'; 
            ctx.strokeStyle = '#FFFFFF'; 
            ctx.lineWidth = 2;
            ctx.font = 'bold 16px Arial'; 
            ctx.textAlign = 'center';
            for (let i = startMeter; i <= endMeter; i++) {
                const tickScreenX = screenCenter + (i - cameraX) * scale;
                ctx.beginPath();
                ctx.moveTo(tickScreenX, screenY);
                ctx.lineTo(tickScreenX, screenY + 12);
                ctx.stroke();
                ctx.fillText(i + 'm', tickScreenX, screenY + 30);
            }

            // 繪製小車
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(cartScreenX - 50, screenY - 20, 100, 40); 

            // 繪製擺桿
            ctx.save(); 
            ctx.translate(cartScreenX, screenY); 
            ctx.rotate(theta); 
            
            ctx.fillStyle = '#F44336';
            const poleWidth = 14; 
            ctx.fillRect(-poleWidth/2, -polePixelLength, poleWidth, polePixelLength); 
            
            // 軸心
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore(); 

            // --- 繪製憤怒鳥橡皮筋 ---
            if (isDragging) {
                // 1. 計算「抓取點」在目前螢幕上的實際座標 (因為車子和棍子可能正在動)
                // 使用旋轉矩陣將局部座標 (沿著棍子的距離) 轉回螢幕全域座標
                const grabScreenX = cartScreenX + (grabPointDist * scale) * Math.sin(theta);
                const grabScreenY = screenY - (grabPointDist * scale) * Math.cos(theta);

                // 2. 限制拉扯的最長視覺距離 (最大 200px)
                let dx = currentMouseX - grabScreenX;
                let dy = currentMouseY - grabScreenY;
                const pullDist = Math.hypot(dx, dy);
                const maxVisualPull = 200;
                
                let drawMouseX = currentMouseX;
                let drawMouseY = currentMouseY;
                
                // 如果拉超過極限，把滑鼠視覺位置鎖在最大圓周上
                if (pullDist > maxVisualPull) {
                    drawMouseX = grabScreenX + (dx / pullDist) * maxVisualPull;
                    drawMouseY = grabScreenY + (dy / pullDist) * maxVisualPull;
                }

                // 3. 畫橡皮筋 (從抓取點連到滑鼠)
                ctx.strokeStyle = '#FFEB3B'; // 黃色橡皮筋
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(grabScreenX, grabScreenY);
                ctx.lineTo(drawMouseX, drawMouseY);
                ctx.stroke();

                // 畫滑鼠端的「捏點」
                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.arc(drawMouseX, drawMouseY, 8, 0, Math.PI * 2);
                ctx.fill();
                
                // 畫綁在棍子上的「錨點」
                ctx.fillStyle = '#FF9800';
                ctx.beginPath();
                ctx.arc(grabScreenX, grabScreenY, 6, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function loop() {
            const dt = 1.0 / 60.0; 

            let controlForce = (Kp_theta * theta) + 
                               (Kd_theta * theta_dot) + 
                               (Kp_x * x) + 
                               (Kd_x * x_dot);

            controlForce = Math.max(-150, Math.min(150, controlForce));

            physicsStep(dt, controlForce);
            draw();
            requestAnimationFrame(loop);
        }

        // --- 互動偵測 ---
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left; 
            const mouseY = e.clientY - rect.top; 

            const cartScreenX = (canvas.width / 2) + (x - cameraX) * scale;
            const cartScreenY = 400;
            
            const dx = mouseX - cartScreenX;
            const dy = mouseY - cartScreenY;

            const local_x = dx * Math.cos(theta) + dy * Math.sin(theta);
            const local_y = -dx * Math.sin(theta) + dy * Math.cos(theta);

            // 判斷是否點中棍子
            if (local_y <= 0 && local_y >= -polePixelLength && local_x >= -15 && local_x <= 15) {
                isDragging = true;
                grabPointDist = Math.abs(local_y) / scale; // 記住抓在棍子的多高處
                currentMouseX = mouseX;
                currentMouseY = mouseY;
            }
        });

        // 監聽 window 的移動，即使滑鼠拉出畫布外也能保持追蹤
        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const rect = canvas.getBoundingClientRect();
                currentMouseX = e.clientX - rect.left;
                currentMouseY = e.clientY - rect.top;
            }
        });

        window.addEventListener('mouseup', () => {
            if (isDragging) {
                const cartScreenX = (canvas.width / 2) + (x - cameraX) * scale;
                const cartScreenY = 400;

                // 算釋放瞬間的抓取點螢幕座標
                const grabScreenX = cartScreenX + (grabPointDist * scale) * Math.sin(theta);
                const grabScreenY = cartScreenY - (grabPointDist * scale) * Math.cos(theta);

                // 計算向量 (抓取點 - 滑鼠點)，這就是憤怒鳥「反方向發射」的力道向量
                let pullX = grabScreenX - currentMouseX;
                let pullY = grabScreenY - currentMouseY;

                // 限制最大拉力 (防止滑鼠拉太遠物理爆炸)
                const maxPull = 200;
                let pullDist = Math.hypot(pullX, pullY);
                if (pullDist > maxPull) {
                    pullX = (pullX / pullDist) * maxPull;
                    pullY = (pullY / pullDist) * maxPull;
                }

                // 透過局部空間轉換，提取出「垂直於棍子方向」的橫向力 (才會產生力矩)
                const pullLocalX = pullX * Math.cos(theta) + pullY * Math.sin(theta);

                // 衝量 = 橫向力道 * 力臂長度 * 力道轉換常數
                const pullMultiplier = 0.015; // 這個常數決定了橡皮筋的威力
                const impulse = pullLocalX * grabPointDist * pullMultiplier;
                
                theta_dot += impulse; // 瞬間打擊
                isDragging = false;
            }
        });

        requestAnimationFrame(loop);
    </script>
</body>
</html>
