<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>2D 倒立擺 - 蓄力彈擊與邊界限制</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #222;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        canvas {
            background-color: #333;
            border: 2px solid #555;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
        }
        .instructions {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #aaa;
            text-align: center;
            line-height: 1.5;
        }
        .highlight { color: #4CAF50; font-weight: bold; }
        .warning { color: #FFEB3B; font-weight: bold; }
    </style>
</head>
<body>

    <h2>倒立擺 (Cart-Pole) 蓄力彈擊版</h2>
    <canvas id="simCanvas" width="800" height="500"></canvas>
    <div class="instructions">
        點擊並<span class="warning">長按棍子蓄力</span>，<span class="highlight">放開滑鼠</span>瞬間給予彈擊！<br>
        推力已調弱，且小車碰到邊界會自動反彈。
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // --- 物理常數與狀態 ---
        const gravity = 9.81;
        const M = 1.0;   
        const m = 0.2;   
        const l = 1.0;   
        const scale = 100; 
        const polePixelLength = l * 2 * scale; 

        let x = 0.0;          
        let x_dot = 0.0;      
        let theta = 0.05;     
        let theta_dot = 0.0;  

        const Kp_theta = 300.0; 
        const Kd_theta = 60.0;
        const Kp_x = 8.0;
        const Kd_x = 12.0;

        // --- 互動狀態變數 ---
        let isTouching = false;    
        let touchHitDist = 0;      
        let touchSide = 1;         
        let chargeRatio = 0; // 【修改】蓄力比例，範圍 0.0 到 1.0 (代表 0% 到 100%)

        // --- 物理引擎 ---
        function physicsStep(dt, force) {
            const totalMass = M + m;
            const ml = m * l;
            const sinTheta = Math.sin(theta);
            const cosTheta = Math.cos(theta);

            // 小車的水平動力學 (移除原先持續施加的外力)
            const temp = (force + ml * theta_dot * theta_dot * sinTheta) / totalMass;
            let theta_acc = (gravity * sinTheta - cosTheta * temp) / 
                            (l * (4.0 / 3.0 - (m * cosTheta * cosTheta) / totalMass));
            const x_acc = temp - (ml * theta_acc * cosTheta) / totalMass;

            // 數值積分
            x_dot += x_acc * dt;
            theta_dot += theta_acc * dt;
            x += x_dot * dt;
            theta += theta_dot * dt;

            // 【新增】邊界碰撞限制 (防止移出畫面)
            // 畫面寬度800px，中心400px，小車寬100px。
            // 允許的物理X座標極限約為正負 3.0 公尺 (300px)
            const max_x = 3.0;
            if (x > max_x) {
                x = max_x;            // 強制拉回邊界內
                x_dot = -x_dot * 0.5; // 撞牆反彈，並損失 50% 的動能
            } else if (x < -max_x) {
                x = -max_x;
                x_dot = -x_dot * 0.5;
            }
        }

        // --- 繪圖邏輯 ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const screenX = canvas.width / 2 + x * scale;
            const screenY = 400; 

            // 軌道與邊界牆示意
            ctx.fillStyle = '#888';
            ctx.fillRect(50, screenY, 700, 4); // 縮短軌道以符合邊界
            ctx.fillRect(50, screenY - 20, 10, 24); // 左擋板
            ctx.fillRect(740, screenY - 20, 10, 24); // 右擋板

            // 小車
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(screenX - 50, screenY - 20, 100, 40); 

            // 擺桿
            ctx.save(); 
            ctx.translate(screenX, screenY); 
            ctx.rotate(theta); 
            
            ctx.fillStyle = '#F44336';
            const poleWidth = 14; 
            ctx.fillRect(-poleWidth/2, -polePixelLength, poleWidth, polePixelLength); 
            
            // 蓄力視覺指示器
            if (isTouching) {
                // 依照蓄力比例改變顏色 (黃 -> 橘紅)
                ctx.fillStyle = `rgb(255, ${255 - chargeRatio * 150}, 0)`;
                const yPos = -touchHitDist * scale; 
                const visualForceLen = chargeRatio * 60; // 最大長度 60px
                
                if (touchSide === 1) {
                    ctx.fillRect(-poleWidth/2 - visualForceLen, yPos - 3, visualForceLen, 6);
                } else {
                    ctx.fillRect(poleWidth/2, yPos - 3, visualForceLen, 6);
                }
            }
            
            // 軸心
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, 5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore(); 
        }

        function loop() {
            const dt = 1.0 / 60.0; 

            // 【新增】處理長按蓄力邏輯
            if (isTouching) {
                chargeRatio += 1.5 * dt; // 蓄力速度：大約 0.66 秒集滿
                if (chargeRatio > 1.0) chargeRatio = 1.0; // 鎖定在 100%
            }

            let controlForce = (Kp_theta * theta) + 
                               (Kd_theta * theta_dot) + 
                               (Kp_x * x) + 
                               (Kd_x * x_dot);

            controlForce = Math.max(-150, Math.min(150, controlForce));

            physicsStep(dt, controlForce);
            draw();
            requestAnimationFrame(loop);
        }

        // --- 互動偵測 ---
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left; 
            const mouseY = e.clientY - rect.top; 

            const cartScreenX = canvas.width / 2 + x * scale;
            const cartScreenY = 400;
            
            const dx = mouseX - cartScreenX;
            const dy = mouseY - cartScreenY;

            const local_x = dx * Math.cos(theta) + dy * Math.sin(theta);
            const local_y = -dx * Math.sin(theta) + dy * Math.cos(theta);

            if (local_y <= 0 && local_y >= -polePixelLength && local_x >= -15 && local_x <= 15) {
                isTouching = true;
                chargeRatio = 0.0; // 從 0 開始蓄力
                touchHitDist = Math.abs(local_y) / scale; 
                touchSide = local_x < 0 ? 1 : -1;
            }
        });

        // 【修改】滑鼠放開時才給予瞬間推力 (衝量)
        window.addEventListener('mouseup', () => {
            if (isTouching) {
                // maxKick 是一個經驗常數，調小這個值就能把推力變小
                const maxKick = 2.5; 
                
                // 衝量 = 方向 * 蓄力比例 * 力臂長度 * 最大推力基數
                const impulse = touchSide * chargeRatio * touchHitDist * maxKick;
                
                // 瞬間改變角速度
                theta_dot += impulse;

                isTouching = false;
                chargeRatio = 0.0;
            }
        });

        requestAnimationFrame(loop);
    </script>
</body>
</html>
