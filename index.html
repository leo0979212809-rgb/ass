<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>倒立擺系統與 PID 控制器動態沙盒</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            overflow: hidden; 
        }
        canvas {
            display: block; 
            background-color: #2b2b2b;
            cursor: crosshair; 
        }
        
        /* --- 【新增】UI 控制面板樣式 --- */
        #controlPanel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(30, 30, 30, 0.85);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #444;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            width: 320px;
            z-index: 10;
            backdrop-filter: blur(5px);
        }
        #controlPanel h3 {
            margin: 0 0 15px 0;
            font-size: 18px;
            color: #4CAF50;
            border-bottom: 1px solid #555;
            padding-bottom: 10px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 5px;
            color: #ccc;
        }
        .val-display {
            font-weight: bold;
            color: #fff;
        }
        input[type=range] {
            width: 100%;
            cursor: pointer;
            accent-color: #4CAF50;
        }
        /* 特別區分角度與位置的顏色 */
        .theta-group input[type=range] { accent-color: #FF9800; }
        .x-group input[type=range] { accent-color: #03A9F4; }
        
        #resetBtn {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: #F44336;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        #resetBtn:hover {
            background-color: #D32F2F;
        }
    </style>
</head>
<body>

    <div id="controlPanel">
        <h3>即時 PID 參數調校 (Tuning)</h3>
        
        <div class="control-group theta-group">
            <label><span>Kp,θ (角度比例)</span> <span id="val_kp_theta" class="val-display">300.0</span></label>
            <input type="range" id="slider_kp_theta" min="0" max="800" step="5" value="300">
        </div>
        <div class="control-group theta-group">
            <label><span>Kd,θ (角度微分/阻尼)</span> <span id="val_kd_theta" class="val-display">60.0</span></label>
            <input type="range" id="slider_kd_theta" min="0" max="150" step="1" value="60">
        </div>
        
        <div style="height: 10px;"></div> <div class="control-group x-group">
            <label><span>Kp,x (位置比例)</span> <span id="val_kp_x" class="val-display">3.0</span></label>
            <input type="range" id="slider_kp_x" min="0" max="30" step="0.5" value="3">
        </div>
        <div class="control-group x-group">
            <label><span>Kd,x (位置微分/煞車)</span> <span id="val_kd_x" class="val-display">8.0</span></label>
            <input type="range" id="slider_kd_x" min="0" max="50" step="0.5" value="8">
        </div>

        <button id="resetBtn">🚀 重置為最佳參數</button>
    </div>

    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // --- 全螢幕自適應設定 ---
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- 物理常數與狀態 ---
        const gravity = 9.81;
        const M = 1.0;   
        const m = 0.2;   
        const l = 1.0;   
        const scale = 100; 
        const polePixelLength = l * 2 * scale; 

        let x = 0.0;          
        let x_dot = 0.0;      
        let theta = 0.05;     
        let theta_dot = 0.0;  

        // --- 【修改】將 const 改為 let，允許動態修改 ---
        let Kp_theta = 300.0; 
        let Kd_theta = 60.0;
        let Kp_x = 3.0;  
        let Kd_x = 8.0;

        let isDragging = false;       
        let grabPointDist = 0;        
        let currentMouseX = 0;        
        let currentMouseY = 0;        
        let cameraX = 0.0; 

        const prison = { x: 20, y: 20, w: 200, h: 100, isBroken: false };
        let shards = []; 

        let monster = {
            x: 0, y: 0, 
            vx: 0, vy: 0,  
            w: 150, h: 48, 
            state: 4,      
            timer: 10.0,   
            offsetX: 0, offsetY: 0,
            attackTimer: 5.0,     
            attackCooldown: 0.0
        };

        const getScreenY = () => canvas.height - 150;

        // --- 數據採集專用變數 ---
        let simulationTime = 0.0;
        let hasPrintedHeader = false;
        let hasPrintedFooter = false;

        // --- 上台報告控制節奏變數 ---
        let isCartStable = false;             
        let recoveryWaitTimer = 0.0;          
        let slingshotFiredThisCycle = false;  
        let successfulRecoveries = 0;         

        // --- 【新增】綁定 UI 滑桿事件 ---
        function bindSlider(sliderId, displayId, variableName) {
            const slider = document.getElementById(sliderId);
            const display = document.getElementById(displayId);
            slider.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                display.innerText = val.toFixed(1);
                // 使用 eval 動態更新變數 (僅限此處簡單綁定使用)
                if(variableName === 'Kp_theta') Kp_theta = val;
                if(variableName === 'Kd_theta') Kd_theta = val;
                if(variableName === 'Kp_x') Kp_x = val;
                if(variableName === 'Kd_x') Kd_x = val;
            });
        }
        
        bindSlider('slider_kp_theta', 'val_kp_theta', 'Kp_theta');
        bindSlider('slider_kd_theta', 'val_kd_theta', 'Kd_theta');
        bindSlider('slider_kp_x', 'val_kp_x', 'Kp_x');
        bindSlider('slider_kd_x', 'val_kd_x', 'Kd_x');

        // 重置按鈕邏輯
        document.getElementById('resetBtn').addEventListener('click', () => {
            Kp_theta = 300.0;
            Kd_theta = 60.0;
            Kp_x = 3.0;
            Kd_x = 8.0;
            
            document.getElementById('slider_kp_theta').value = 300;
            document.getElementById('val_kp_theta').innerText = "300.0";
            
            document.getElementById('slider_kd_theta').value = 60;
            document.getElementById('val_kd_theta').innerText = "60.0";
            
            document.getElementById('slider_kp_x').value = 3;
            document.getElementById('val_kp_x').innerText = "3.0";
            
            document.getElementById('slider_kd_x').value = 8;
            document.getElementById('val_kd_x').innerText = "8.0";
        });

        // --- 物理引擎 ---
        function physicsStep(dt, force) {
            const totalMass = M + m;
            const ml = m * l;
            const sinTheta = Math.sin(theta);
            const cosTheta = Math.cos(theta);

            const temp = (force + ml * theta_dot * theta_dot * sinTheta) / totalMass;
            let theta_acc = (gravity * sinTheta - cosTheta * temp) / 
                            (l * (4.0 / 3.0 - (m * cosTheta * cosTheta) / totalMass));
            const x_acc = temp - (ml * theta_acc * cosTheta) / totalMass;

            x_dot += x_acc * dt;
            theta_dot += theta_acc * dt;
            x += x_dot * dt;
            theta += theta_dot * dt;

            // 自動數據採集
            simulationTime += dt;
            if (!hasPrintedHeader) {
                console.log("Time(s), Theta(rad), Position_X(m), Force(N)");
                hasPrintedHeader = true;
            }
            if (simulationTime <= 10.0) {
                console.log(`${simulationTime.toFixed(2)}, ${theta.toFixed(4)}, ${x.toFixed(4)}, ${force.toFixed(2)}`);
            } else if (!hasPrintedFooter) {
                console.log("--- 前 10 秒數據採集結束 ---");
                hasPrintedFooter = true;
            }

            // 全時段監控小車穩定與干擾抵抗次數
            if (Math.abs(x) < 0.1 && Math.abs(theta) < 0.05 && 
                Math.abs(x_dot) < 0.1 && Math.abs(theta_dot) < 0.1) {
                
                recoveryWaitTimer += dt;
                if (recoveryWaitTimer > 1.0 && !isCartStable) { 
                    isCartStable = true;
                    if (slingshotFiredThisCycle) {
                        successfulRecoveries++;
                        slingshotFiredThisCycle = false; 
                        console.log(`🎓 成功抵抗干擾並回穩！目前完成次數：${successfulRecoveries}/3`);
                    }
                }
            } else {
                recoveryWaitTimer = 0; 
                isCartStable = false;
            }
        }

        function bounceMonster(bounds) {
            if (monster.x < bounds.x) { monster.x = bounds.x; monster.vx *= -1; }
            if (monster.x + monster.w > bounds.x + bounds.w) { monster.x = bounds.x + bounds.w - monster.w; monster.vx *= -1; }
            if (monster.y < bounds.y) { monster.y = bounds.y; monster.vy *= -1; }
            if (monster.y + monster.h > bounds.y + bounds.h) { monster.y = bounds.y + bounds.h - monster.h; monster.vy *= -1; }
        }

        function createShatterEffect() {
            for (let i = 0; i < 40; i++) {
                shards.push({
                    x: prison.x + Math.random() * prison.w,
                    y: prison.y + Math.random() * prison.h,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15 - 5, 
                    size: Math.random() * 15 + 8,
                    rot: Math.random() * Math.PI * 2,
                    rotV: (Math.random() - 0.5) * 0.8,
                    alpha: 1.0
                });
            }
        }

        function updateMonster(dt) {
            ctx.font = 'bold 48px "Segoe UI"';
            monster.w = ctx.measureText("倒立擺").width;

            const cartScreenX = (canvas.width / 2) + (x - cameraX) * scale;
            const screenY = getScreenY();

            if (monster.attackCooldown > 0) {
                monster.attackCooldown -= dt;
            }

            if (monster.state === 4) { 
                monster.x = prison.x + (prison.w - monster.w) / 2;
                monster.y = prison.y + (prison.h - monster.h) / 2 + 5; 
                
                if (monster.timer > 0) {
                    monster.timer -= dt;
                }

                if (monster.timer <= 0) {
                    if (successfulRecoveries < 3) {
                        monster.timer = 8.0; 
                    } else if (isCartStable) {
                        monster.state = 1; 
                        prison.isBroken = true;
                        createShatterEffect();
                    }
                }
            }
            else if (monster.state === 0) { 
                if (Math.random() < 0.05) {
                    monster.vx += (Math.random() - 0.5) * 1.5; 
                    monster.vy += (Math.random() - 0.5) * 1.5;
                }
                const speed = Math.hypot(monster.vx, monster.vy);
                if (speed > 2.5) { 
                    monster.vx = (monster.vx/speed)*2.5; 
                    monster.vy = (monster.vy/speed)*2.5; 
                }
                
                monster.x += monster.vx;
                monster.y += monster.vy;
                bounceMonster({x:0, y:0, w:canvas.width, h:canvas.height});

                monster.attackTimer -= dt;
                if (monster.attackTimer <= 0 && monster.attackCooldown <= 0) {
                    monster.state = 1; 
                }
            } 
            else if (monster.state === 1) { 
                const targetX = cartScreenX + (polePixelLength / 2) * Math.sin(theta);
                const targetY = screenY - (polePixelLength / 2) * Math.cos(theta);
                
                const dx = targetX - (monster.x + monster.w/2);
                const dy = targetY - (monster.y + monster.h/2);
                const dist = Math.hypot(dx, dy);

                if (dist > 0) {
                    monster.vx = (dx / dist) * 12;
                    monster.vy = (dy / dist) * 12;
                }
                monster.x += monster.vx;
                monster.y += monster.vy;

                if (dist < 50 && monster.attackCooldown <= 0) {
                    const hitForce = monster.vx > 0 ? 8 : -8;
                    theta_dot += hitForce; 
                    
                    monster.vx = -monster.vx * 0.5;
                    monster.vy = -monster.vy * 0.5;
                    monster.state = 0; 
                    
                    monster.attackCooldown = 1.0;
                    monster.attackTimer = 2.0 + Math.random() * 6.0; 
                }
            }
            else if (monster.state === 2) { 
                const struggleX = (Math.random() - 0.5) * 15;
                const struggleY = (Math.random() - 0.5) * 15;
                monster.x = currentMouseX - monster.offsetX + struggleX;
                monster.y = currentMouseY - monster.offsetY + struggleY;
            }
            else if (monster.state === 3) { 
                monster.vx += (Math.random() - 0.5) * 4;
                monster.vy += (Math.random() - 0.5) * 4;
                const speed = Math.hypot(monster.vx, monster.vy);
                if (speed > 5) { monster.vx = (monster.vx/speed)*5; monster.vy = (monster.vy/speed)*5; }
                
                monster.x += monster.vx;
                monster.y += monster.vy;
                bounceMonster(prison);

                if (isCartStable) {
                    monster.timer -= dt; 
                }

                if (monster.timer <= 0) {
                    monster.state = 1; 
                    prison.isBroken = true;
                    createShatterEffect();
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            cameraX += (x - cameraX) * 0.1;
            const screenCenter = canvas.width / 2;
            const screenY = getScreenY(); 
            const cartScreenX = screenCenter + (x - cameraX) * scale;

            if (!prison.isBroken) {
                if (monster.state === 4) {
                    if (successfulRecoveries === 0) ctx.strokeStyle = '#FFFFFF';      
                    else if (successfulRecoveries === 1) ctx.strokeStyle = '#FFEB3B'; 
                    else if (successfulRecoveries === 2) ctx.strokeStyle = '#FF9800'; 
                    else ctx.strokeStyle = '#FF5722';                                 
                } else if (monster.state === 3) {
                    ctx.strokeStyle = '#FF5722'; 
                } else {
                    ctx.strokeStyle = '#FFFFFF';
                }
                
                ctx.lineWidth = 3;
                ctx.setLineDash([]); 
                ctx.fillStyle = '#000000';
                ctx.fillRect(prison.x, prison.y, prison.w, prison.h);
                ctx.strokeRect(prison.x, prison.y, prison.w, prison.h);
            } else {
                ctx.strokeStyle = '#FFFFFF'; 
                ctx.lineWidth = 2;
                ctx.setLineDash([10, 5]); 
                ctx.strokeRect(prison.x, prison.y, prison.w, prison.h);
                ctx.setLineDash([]);
                
                ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.fillRect(prison.x, prison.y, prison.w, prison.h);
            }

            ctx.strokeStyle = '#777'; 
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, screenY);
            ctx.lineTo(canvas.width, screenY);
            ctx.stroke();

            const viewRadiusInMeters = (canvas.width / 2) / scale;
            const startMeter = Math.floor(cameraX - viewRadiusInMeters);
            const endMeter = Math.ceil(cameraX + viewRadiusInMeters);

            ctx.fillStyle = '#FFFFFF'; 
            ctx.font = 'bold 16px Arial'; 
            ctx.textAlign = 'center';
            for (let i = startMeter; i <= endMeter; i++) {
                const tickScreenX = screenCenter + (i - cameraX) * scale;
                ctx.beginPath();
                ctx.moveTo(tickScreenX, screenY);
                ctx.lineTo(tickScreenX, screenY + 12);
                ctx.stroke();
                ctx.fillText(i + 'm', tickScreenX, screenY + 30);
            }

            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(cartScreenX - 50, screenY - 20, 100, 40); 

            ctx.save(); 
            ctx.translate(cartScreenX, screenY); 
            ctx.rotate(theta); 
            
            ctx.fillStyle = '#F44336';
            const poleWidth = 14; 
            ctx.fillRect(-poleWidth/2, -polePixelLength, poleWidth, polePixelLength); 
            
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore(); 

            for (let i = shards.length - 1; i >= 0; i--) {
                let s = shards[i];
                s.x += s.vx;
                s.y += s.vy;
                s.vy += 0.3; 
                s.rot += s.rotV;
                s.alpha -= 0.015; 

                ctx.save();
                ctx.translate(s.x, s.y);
                ctx.rotate(s.rot);
                ctx.globalAlpha = Math.max(0, s.alpha);
                ctx.fillStyle = '#000000'; 
                ctx.strokeStyle = '#FFFFFF'; 
                ctx.lineWidth = 2;
                ctx.fillRect(-s.size/2, -s.size/2, s.size, s.size);
                ctx.strokeRect(-s.size/2, -s.size/2, s.size, s.size);
                ctx.restore();

                if (s.alpha <= 0) shards.splice(i, 1);
            }

            ctx.font = 'bold 48px "Segoe UI"';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            
            if (monster.state === 4) ctx.fillStyle = '#FFFFFF'; 
            else if (monster.state === 1) ctx.fillStyle = '#F44336'; 
            else if (monster.state === 2) ctx.fillStyle = '#FFC107'; 
            else if (monster.state === 3) ctx.fillStyle = '#FF5722'; 
            else ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; 
            
            ctx.fillText("倒立擺", monster.x, monster.y);

            if (isDragging) {
                const grabScreenX = cartScreenX + (grabPointDist * scale) * Math.sin(theta);
                const grabScreenY = screenY - (grabPointDist * scale) * Math.cos(theta);

                let dx = currentMouseX - grabScreenX;
                let dy = currentMouseY - grabScreenY;
                const pullDist = Math.hypot(dx, dy);
                const maxVisualPull = 200;
                
                let drawMouseX = currentMouseX;
                let drawMouseY = currentMouseY;
                
                if (pullDist > maxVisualPull) {
                    drawMouseX = grabScreenX + (dx / pullDist) * maxVisualPull;
                    drawMouseY = grabScreenY + (dy / pullDist) * maxVisualPull;
                }

                ctx.strokeStyle = '#FFEB3B'; 
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(grabScreenX, grabScreenY);
                ctx.lineTo(drawMouseX, drawMouseY);
                ctx.stroke();

                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.arc(drawMouseX, drawMouseY, 8, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#FF9800';
                ctx.beginPath();
                ctx.arc(grabScreenX, grabScreenY, 6, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function loop() {
            const dt = 1.0 / 60.0; 

            updateMonster(dt);

            // 【套用動態變數】此處使用 global let 變數
            let controlForce = (Kp_theta * theta) + 
                               (Kd_theta * theta_dot) + 
                               (Kp_x * x) + 
                               (Kd_x * x_dot);

            controlForce = Math.max(-150, Math.min(150, controlForce));

            physicsStep(dt, controlForce);
            draw();
            requestAnimationFrame(loop);
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left; 
            const mouseY = e.clientY - rect.top; 
            
            currentMouseX = mouseX;
            currentMouseY = mouseY;

            // 確保沒有點擊到 UI 面板
            if (mouseX > canvas.width - 340 && mouseY < 280) return;

            if (monster.state !== 4 && 
                mouseX >= monster.x && mouseX <= monster.x + monster.w && 
                mouseY >= monster.y && mouseY <= monster.y + monster.h) {
                monster.state = 2; 
                monster.offsetX = mouseX - monster.x;
                monster.offsetY = mouseY - monster.y;
                return;
            }

            const cartScreenX = (canvas.width / 2) + (x - cameraX) * scale;
            const cartScreenY = getScreenY();
            const dx = mouseX - cartScreenX;
            const dy = mouseY - cartScreenY;
            const local_x = dx * Math.cos(theta) + dy * Math.sin(theta);
            const local_y = -dx * Math.sin(theta) + dy * Math.cos(theta);

            if (local_y <= 20 && local_y >= -(polePixelLength + 20) && local_x >= -40 && local_x <= 40) {
                isDragging = true;
                let bounded_local_y = Math.min(0, Math.max(-polePixelLength, local_y));
                grabPointDist = Math.abs(bounded_local_y) / scale; 
            }
        });

        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            currentMouseX = e.clientX - rect.left;
            currentMouseY = e.clientY - rect.top;
        });

        window.addEventListener('mouseup', () => {
            if (monster.state === 2) {
                const centerMX = monster.x + monster.w / 2;
                const centerMY = monster.y + monster.h / 2;
                
                if (centerMX > prison.x && centerMX < prison.x + prison.w && 
                    centerMY > prison.y && centerMY < prison.y + prison.h) {
                    
                    monster.state = 3; 
                    monster.timer = 5.0; 
                    prison.isBroken = false; 
                    
                } else {
                    monster.state = 0; 
                    monster.vx = 0; monster.vy = 0; 
                    monster.attackTimer = 2.0 + Math.random() * 6.0; 
                }
            }

            if (isDragging) {
                const cartScreenX = (canvas.width / 2) + (x - cameraX) * scale;
                const cartScreenY = getScreenY();
                const grabScreenX = cartScreenX + (grabPointDist * scale) * Math.sin(theta);
                const grabScreenY = cartScreenY - (grabPointDist * scale) * Math.cos(theta);

                let pullX = grabScreenX - currentMouseX;
                let pullY = grabScreenY - currentMouseY;

                const maxPull = 200;
                let pullDist = Math.hypot(pullX, pullY);
                if (pullDist > maxPull) {
                    pullX = (pullX / pullDist) * maxPull;
                    pullY = (pullY / pullDist) * maxPull;
                }

                const pullLocalX = pullX * Math.cos(theta) + pullY * Math.sin(theta);
                const pullMultiplier = 0.015; 
                const impulse = pullLocalX * grabPointDist * pullMultiplier;
                
                theta_dot += impulse; 
                isDragging = false;
                
                slingshotFiredThisCycle = true;
                isCartStable = false; 
                recoveryWaitTimer = 0;
            }
        });

        requestAnimationFrame(loop);
    </script>
</body>
</html>
