<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>2D 倒立擺 - 精準施力與蓄力測試</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #222;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; /* 防止連點時選取到文字 */
        }
        canvas {
            background-color: #333;
            border: 2px solid #555;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
        }
        .instructions {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #aaa;
            text-align: center;
            line-height: 1.5;
        }
        .highlight { color: #4CAF50; font-weight: bold; }
        .warning { color: #FFEB3B; font-weight: bold; }
    </style>
</head>
<body>

    <h2>倒立擺 (Cart-Pole) 進階互動版</h2>
    <canvas id="simCanvas" width="800" height="500"></canvas>
    <div class="instructions">
        點擊並<span class="warning">長按棍子本身</span>！按得越久，推力越強。<br>
        點擊位置越靠近頂端，產生的<span class="highlight">力矩 (Torque)</span> 越大。
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // --- 物理常數與狀態 ---
        const gravity = 9.81;
        const M = 1.0;   
        const m = 0.2;   // 稍微增加棍子質量，讓加長後的物理表現更穩定
        const l = 1.0;   // 【修改】半長度從 0.5 改為 1.0，棍子總長變成原本的兩倍
        const scale = 100; // 1公尺 = 100像素
        const polePixelLength = l * 2 * scale; // 棍子總長 200px

        let x = 0.0;          
        let x_dot = 0.0;      
        let theta = 0.05;     
        let theta_dot = 0.0;  

        // 【修改】因為棍子變長了，倒下時的力道變大，我們需要稍微調強 PID 控制器
        const Kp_theta = 300.0; 
        const Kd_theta = 60.0;
        const Kp_x = 8.0;
        const Kd_x = 12.0;

        // --- 互動狀態變數 ---
        let isTouching = false;    // 是否按在棍子上
        let touchHitDist = 0;      // 點擊位置距離軸心的長度 (力臂，單位: 公尺)
        let touchSide = 1;         // 1 表示從左往右推, -1 表示從右往左推
        let chargePower = 0;       // 蓄力累積的力道

        // --- 物理引擎 ---
        function physicsStep(dt, force) {
            const totalMass = M + m;
            const ml = m * l;
            const sinTheta = Math.sin(theta);
            const cosTheta = Math.cos(theta);

            // 小車的水平動力學
            const temp = (force + ml * theta_dot * theta_dot * sinTheta) / totalMass;
            let theta_acc = (gravity * sinTheta - cosTheta * temp) / 
                            (l * (4.0 / 3.0 - (m * cosTheta * cosTheta) / totalMass));
            const x_acc = temp - (ml * theta_acc * cosTheta) / totalMass;

            // 【新增】如果玩家正在長按棍子，將外力轉換為力矩 (Torque) 並加入角加速度
            if (isTouching) {
                // 累積力道 (每秒增加 150，最大限制在 150 避免物理爆炸)
                chargePower += 150 * dt;
                if (chargePower > 150) chargePower = 150;

                // 物理學：力矩 (Torque) = 正向力 * 力臂距離
                const torque = touchSide * chargePower * touchHitDist;
                
                // 將力矩轉換為角加速度 (力矩 / 轉動慣量)
                // 均勻細長桿繞端點旋轉的轉動慣量 I = (4/3) * m * l^2  (這裡 l 是半長度)
                const inertia = (4.0 / 3.0) * m * (l * l);
                const extraThetaAcc = torque / inertia;
                
                theta_acc += extraThetaAcc;
            }

            // 數值積分
            x_dot += x_acc * dt;
            theta_dot += theta_acc * dt;
            x += x_dot * dt;
            theta += theta_dot * dt;
        }

        // --- 繪圖邏輯 ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const screenX = canvas.width / 2 + x * scale;
            const screenY = 400; // 軌道高度

            // 軌道
            ctx.fillStyle = '#888';
            ctx.fillRect(0, screenY, canvas.width, 4);

            // 小車
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(screenX - 50, screenY - 20, 100, 40); 

            // 擺桿
            ctx.save(); 
            ctx.translate(screenX, screenY); 
            ctx.rotate(theta); 
            
            ctx.fillStyle = '#F44336';
            const poleWidth = 14; // 稍微變寬一點
            ctx.fillRect(-poleWidth/2, -polePixelLength, poleWidth, polePixelLength); 
            
            // 【新增】如果正在按著，畫出「力道視覺指示器 (推力箭頭)」
            if (isTouching) {
                ctx.fillStyle = '#FFEB3B';
                const yPos = -touchHitDist * scale; // 轉換回像素座標
                const visualForceLen = chargePower * 0.4; // 力道長度視覺化
                
                if (touchSide === 1) {
                    // 從左往右推 (畫在左側)
                    ctx.fillRect(-poleWidth/2 - visualForceLen, yPos - 3, visualForceLen, 6);
                } else {
                    // 從右往左推 (畫在右側)
                    ctx.fillRect(poleWidth/2, yPos - 3, visualForceLen, 6);
                }
            }
            
            // 軸心圓點
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, 5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore(); 
        }

        function loop() {
            const dt = 1.0 / 60.0; 

            // 小車 PID 控制力
            let controlForce = (Kp_theta * theta) + 
                               (Kd_theta * theta_dot) + 
                               (Kp_x * x) + 
                               (Kd_x * x_dot);

            controlForce = Math.max(-150, Math.min(150, controlForce));

            physicsStep(dt, controlForce);
            draw();
            requestAnimationFrame(loop);
        }

        // --- 互動偵測 (座標轉換) ---
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left; 
            const mouseY = e.clientY - rect.top; 

            const cartScreenX = canvas.width / 2 + x * scale;
            const cartScreenY = 400;
            
            // 1. 計算滑鼠相對於小車中心的距離
            const dx = mouseX - cartScreenX;
            const dy = mouseY - cartScreenY;

            // 2. 進行二維旋轉矩陣轉換 (將滑鼠座標轉為棍子的「局部空間」)
            // 棍子直立時是朝上 (Canvas的 -Y 方向)，我們逆向旋轉 theta 來對齊
            const local_x = dx * Math.cos(theta) + dy * Math.sin(theta);
            const local_y = -dx * Math.sin(theta) + dy * Math.cos(theta);

            // 3. 碰撞測試 (Hit Box)
            // 棍子在局部空間中，Y範圍是 0 到 -polePixelLength，X範圍是 -15 到 +15 (稍微給一點點寬容度)
            if (local_y <= 0 && local_y >= -polePixelLength && local_x >= -15 && local_x <= 15) {
                isTouching = true;
                chargePower = 0; // 重置力道
                
                // 紀錄按下的位置距離軸心有多遠 (轉換回物理公尺)
                touchHitDist = Math.abs(local_y) / scale; 
                
                // 判斷按在棍子的哪一側：按左側 (local_x < 0)，力道往右推 (+1)
                touchSide = local_x < 0 ? 1 : -1;
            }
        });

        // 當滑鼠放開 (監聽 window 確保滑鼠移出畫布放開也能偵測到)
        window.addEventListener('mouseup', () => {
            isTouching = false;
            chargePower = 0;
        });

        requestAnimationFrame(loop);
    </script>
</body>
</html>
