<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>倒立擺</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        canvas {
            background-color: #2b2b2b;
            border: 2px solid #555;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            margin-top: 15px;
        }
        h1 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: 5px;
            color: #ddd;
        }
        #modeBtn {
            margin-top: 15px;
            padding: 12px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: background 0.3s;
        }
        #modeBtn:hover {
            filter: brightness(1.1);
        }
    </style>
</head>
<body>

    <h1>倒立擺</h1>
    <button id="modeBtn">目前模式：允許掉落與自動起擺 (Swing-Up)</button>
    <canvas id="simCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // --- 控制模式狀態 ---
        let allowSwingUp = true;
        const modeBtn = document.getElementById('modeBtn');
        modeBtn.addEventListener('click', () => {
            allowSwingUp = !allowSwingUp;
            if (allowSwingUp) {
                modeBtn.innerText = "目前模式：允許掉落與自動起擺 (Swing-Up)";
                modeBtn.style.background = "#4CAF50";
            } else {
                modeBtn.innerText = "目前模式：強制保持平衡 (嚴格 PID)";
                modeBtn.style.background = "#F44336";
            }
        });

        // --- 物理常數與狀態 ---
        const gravity = 9.81;
        const M = 1.0;   
        const m = 0.2;   
        const l = 1.0;   
        const scale = 100; 
        const polePixelLength = l * 2 * scale; 

        let x = 0.0;          
        let x_dot = 0.0;      
        let theta = 0.05;     
        let theta_dot = 0.0;  

        // PID 參數
        const Kp_theta = 300.0; 
        const Kd_theta = 60.0;
        const Kp_x = 3.0;  
        const Kd_x = 8.0;

        // --- 互動與鏡頭變數 ---
        let isTouching = false;    
        let touchHitDist = 0;      
        let touchSide = 1;         
        let chargeRatio = 0.0; 
        let cameraX = 0.0; 

        // --- 物理引擎 ---
        function physicsStep(dt, force) {
            const totalMass = M + m;
            const ml = m * l;
            const sinTheta = Math.sin(theta);
            const cosTheta = Math.cos(theta);

            const temp = (force + ml * theta_dot * theta_dot * sinTheta) / totalMass;
            let theta_acc = (gravity * sinTheta - cosTheta * temp) / 
                            (l * (4.0 / 3.0 - (m * cosTheta * cosTheta) / totalMass));
            const x_acc = temp - (ml * theta_acc * cosTheta) / totalMass;

            x_dot += x_acc * dt;
            theta_dot += theta_acc * dt;
            x += x_dot * dt;
            theta += theta_dot * dt;

            // 【重要】將角度限制在 -PI 到 PI 之間，避免數學計算溢位
            while (theta > Math.PI) theta -= 2 * Math.PI;
            while (theta < -Math.PI) theta += 2 * Math.PI;
        }

        // --- 繪圖邏輯 ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            cameraX += (x - cameraX) * 0.1;
            const screenCenter = canvas.width / 2;
            const screenY = 400; 
            const cartScreenX = screenCenter + (x - cameraX) * scale;

            ctx.strokeStyle = '#555';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, screenY);
            ctx.lineTo(canvas.width, screenY);
            ctx.stroke();

            const viewRadiusInMeters = (canvas.width / 2) / scale;
            const startMeter = Math.floor(cameraX - viewRadiusInMeters);
            const endMeter = Math.ceil(cameraX + viewRadiusInMeters);

            // 【修改】將 X 軸文字改為純白色 #FFFFFF
            ctx.fillStyle = '#FFFFFF';
            ctx.strokeStyle = '#888';
            ctx.font = '14px Arial';
            ctx.textAlign = 'center';
            for (let i = startMeter; i <= endMeter; i++) {
                const tickScreenX = screenCenter + (i - cameraX) * scale;
                ctx.beginPath();
                ctx.moveTo(tickScreenX, screenY);
                ctx.lineTo(tickScreenX, screenY + 10);
                ctx.stroke();
                ctx.fillText(i + 'm', tickScreenX, screenY + 25);
            }

            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(cartScreenX - 50, screenY - 20, 100, 40); 

            ctx.save(); 
            ctx.translate(cartScreenX, screenY); 
            ctx.rotate(theta); 
            
            ctx.fillStyle = '#F44336';
            const poleWidth = 14; 
            ctx.fillRect(-poleWidth/2, -polePixelLength, poleWidth, polePixelLength); 
            
            if (isTouching) {
                ctx.fillStyle = `rgb(255, ${255 - chargeRatio * 150}, 0)`;
                const yPos = -touchHitDist * scale; 
                const visualForceLen = chargeRatio * 60; 
                if (touchSide === 1) {
                    ctx.fillRect(-poleWidth/2 - visualForceLen, yPos - 3, visualForceLen, 6);
                } else {
                    ctx.fillRect(poleWidth/2, yPos - 3, visualForceLen, 6);
                }
            }
            
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, 5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore(); 
        }

        // --- 主迴圈與兩階段控制器 ---
        function loop() {
            const dt = 1.0 / 60.0; 

            if (isTouching) {
                chargeRatio += 1.5 * dt; 
                if (chargeRatio > 1.0) chargeRatio = 1.0; 
            }

            let controlForce = 0;
            
            // 判斷棍子是否超出可挽救的範圍 (大約 23 度)
            const isFalling = Math.abs(theta) > 0.4;

            if (allowSwingUp && isFalling) {
                // ==========================================
                // 第一階段：起擺控制 (Energy-based Swing-Up)
                // ==========================================
                
                // 計算系統目前的總機械能
                const inertia = (4.0 / 3.0) * m * l * l; // 轉動慣量
                const E_kinetic = 0.5 * inertia * theta_dot * theta_dot;
                const E_potential = m * gravity * l * Math.cos(theta);
                const E_total = E_kinetic + E_potential;
                
                // 目標能量 (直立靜止時的位能)
                const E_target = m * gravity * l;

                if (E_total < E_target) {
                    // 能量不夠，計算該往哪邊推來產生「盪鞦韆」的效果
                    let pumpDirection = theta_dot * Math.cos(theta);
                    
                    // 給一個微小的初始擾動，避免完全垂直朝下時卡死
                    if (Math.abs(pumpDirection) < 0.01) pumpDirection = 0.01; 

                    // 施加巨大的力道來甩動棍子
                    controlForce = Math.sign(pumpDirection) * 120.0;
                }
                
                // 在甩動的過程中，加一點點力量防止小車跑太遠
                controlForce -= (5.0 * x + 10.0 * x_dot);

            } else {
                // ==========================================
                // 第二階段：平衡控制 (Strict PID)
                // ==========================================
                controlForce = (Kp_theta * theta) + 
                               (Kd_theta * theta_dot) + 
                               (Kp_x * x) + 
                               (Kd_x * x_dot);
            }

            // 安全機制：馬達推力上限
            controlForce = Math.max(-180, Math.min(180, controlForce));

            physicsStep(dt, controlForce);
            draw();
            requestAnimationFrame(loop);
        }

        // --- 互動偵測 ---
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left; 
            const mouseY = e.clientY - rect.top; 

            const cartScreenX = (canvas.width / 2) + (x - cameraX) * scale;
            const cartScreenY = 400;
            
            const dx = mouseX - cartScreenX;
            const dy = mouseY - cartScreenY;

            const local_x = dx * Math.cos(theta) + dy * Math.sin(theta);
            const local_y = -dx * Math.sin(theta) + dy * Math.cos(theta);

            if (local_y <= 0 && local_y >= -polePixelLength && local_x >= -15 && local_x <= 15) {
                isTouching = true;
                chargeRatio = 0.0; 
                touchHitDist = Math.abs(local_y) / scale; 
                touchSide = local_x < 0 ? 1 : -1;
            }
        });

        window.addEventListener('mouseup', () => {
            if (isTouching) {
                const maxKick = 5.0; 
                const impulse = touchSide * chargeRatio * touchHitDist * maxKick;
                theta_dot += impulse;
                isTouching = false;
                chargeRatio = 0.0;
            }
        });

        requestAnimationFrame(loop);
    </script>
</body>
</html>
